backend:
  name: github
  repo: farhan0-0labib/Farhan-Labib
  branch: main
  base_url: https://decap-oauth.farhanlabib5225.workers.dev
  auth_endpoint: /auth

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "site_content"
    label: "Website Content"
    files:
      - name: "site"
        label: "Site Settings & Pages"
        file: "site-data.json"
        fields:
          - { label: "Website Name", name: "name", widget: "string" }
          - { label: "Home Tagline", name: "tagline", widget: "string" }
          - { label: "Profile Photo", name: "photo", widget: "image", required: false }
          - { label: "About Page Title", name: "aboutTitle", widget: "string" }
          - { label: "About Page Text", name: "aboutText", widget: "markdown" }
          - { label: "Email Address", name: "email", widget: "string" }
          - { label: "Location", name: "location", widget: "string", required: false }
          - { label: "Accent Color", name: "accent", widget: "color", required: false, default: "#8b5cf6" }
          - { label: "Top Banner Text (leave empty to hide)", name: "announcement", widget: "string", required: false }
          - { label: "Banner Link", name: "announcementLink", widget: "string", required: false }
          - { label: "Typing Roles (home page)", name: "roles", widget: "list", required: false, summary: "{{fields.role}}", field: { label: "Role", name: "role", widget: "string" } }
          - { label: "Extra Stats", name: "stats", widget: "list", required: false, summary: "{{fields.value}} {{fields.label}}", fields: [ { label: "Value", name: "value", widget: "string" }, { label: "Label", name: "label", widget: "string" } ] }
          - { label: "Skills", name: "skills", widget: "list", required: false, summary: "{{fields.name}}", fields: [ { label: "Skill", name: "name", widget: "string" }, { label: "Level (0-100)", name: "level", widget: "number", value_type: "int", min: 0, max: 100 } ] }
          - { label: "Projects", name: "projects", widget: "list", required: false, summary: "{{fields.title}}", fields: [ { label: "Title", name: "title", widget: "string" }, { label: "Description", name: "description", widget: "text" }, { label: "Link", name: "link", widget: "string", required: false }, { label: "Image", name: "image", widget: "image", required: false }, { label: "Tags", name: "tags", widget: "list", required: false } ] }
          - { label: "Journey / Timeline", name: "timeline", widget: "list", required: false, summary: "{{fields.year}} {{fields.title}}", fields: [ { label: "Year / Date", name: "year", widget: "string" }, { label: "Title", name: "title", widget: "string" }, { label: "Details", name: "text", widget: "text", required: false } ] }
          - label: "Social Media Links"
            name: "socials"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Platform Name", name: "name", widget: "string" }
              - { label: "Profile URL", name: "url", widget: "string" }
              - { label: "Short Description", name: "label", widget: "string", required: false }
          - label: "Blog Posts"
            name: "posts"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Post Title", name: "title", widget: "string" }
              - { label: "Publish Date", name: "date", widget: "datetime" }
              - { label: "URL Slug (unique)", name: "slug", widget: "string" }
              - { label: "Cover Image", name: "cover", widget: "image", required: false }
              - { label: "Tags", name: "tags", widget: "list", required: false }
              - { label: "Post Body", name: "body", widget: "markdown" }

  - name: "routine"
    label: "Weekly Routine"
    folder: "_routine"
    create: true
    slug: "{{fields.day}}" # দিনের নামেই ফাইল সেভ হবে
    fields:
      - {label: "Day of the Week", name: "day", widget: "select", options: ["Saturday", "Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday"]}
      - {label: "Subject", name: "subject", widget: "string"}
      # এখানে datetime ব্যবহার করা হয়েছে যাতে অ্যাডমিন প্যানেলে ঘড়ি (Time Picker) আসে
      - {label: "Event Time", name: "event_time", widget: "datetime", format: "HH:mm", time_format: "HH:mm", date_format: false, default: ""}
      - {label: "Notification Time", name: "notify_time", widget: "datetime", format: "HH:mm", time_format: "HH:mm", date_format: false, default: ""}
      - {label: "Details (Optional)", name: "body", widget: "markdown", required: false}
