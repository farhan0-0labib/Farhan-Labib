backend:
  name: github
  repo: farhan0-0labib/Farhan-Labib
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "site_content"
    label: "Website Content"
    files:
      - name: "site"
        label: "Site Settings & Pages"
        file: "site-data.json"
        fields:
          - { label: "Website Name", name: "name", widget: "string" }
          - { label: "Home Tagline", name: "tagline", widget: "string" }
          - { label: "Profile Photo", name: "photo", widget: "image", required: false }
          - { label: "About Page Title", name: "aboutTitle", widget: "string" }
          - { label: "About Page Text", name: "aboutText", widget: "markdown" }
          - { label: "Email Address", name: "email", widget: "string" }
          - { label: "Location", name: "location", widget: "string", required: false }
          - label: "Social Media Links"
            name: "socials"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Platform Name", name: "name", widget: "string" }
              - { label: "Profile URL", name: "url", widget: "string" }
              - { label: "Short Description", name: "label", widget: "string", required: false }
          - label: "Blog Posts"
            name: "posts"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Post Title", name: "title", widget: "string" }
              - { label: "Publish Date", name: "date", widget: "datetime" }
              - { label: "URL Slug (unique)", name: "slug", widget: "string" }
              - { label: "Post Body", name: "body", widget: "markdown" }
name: Routine Telegram Alert

on:
  schedule:
    # প্রতি ৩০ মিনিট পর পর চেক করবে
    - cron: '*/30 * * * *'
  workflow_dispatch: # ম্যানুয়ালি চালানোর জন্য

jobs:
  send-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Run Telegram Bot Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node check-routine.js
        - name: "routine"
  label: "My Routine"
  folder: "_routine"
  create: true
  slug: "{{year}}-{{month}}-{{day}}"
  fields:
    - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
    - { label: "Routine Details", name: "body", widget: "markdown", hint: "আজকের রুটিন এখানে লিখুন" }
