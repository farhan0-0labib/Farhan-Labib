<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Routine | Farhan Labib</title>
<link rel="stylesheet" href="styles.css">
<style>
.rt h2{margin:0}.rt .muted{color:var(--muted)}
.rt-hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.rt-sum{color:var(--muted);font-size:.92rem}
.rt-today{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:34px}
.rt-t{position:relative;padding:16px;border-radius:6px;border:1px solid var(--line);background:var(--sheet);transition:.25s}
.rt-t b{display:block;font-size:1.5rem;letter-spacing:-.03em}.rt-t span{display:block;font-weight:650}.rt-t em{font-style:normal;font-size:.75rem;color:var(--muted)}
.rt-t.next{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.rt-t.next em{color:var(--accent);font-weight:800}
.rt-t.past{opacity:.5}
.rt-empty{padding:22px;border:1px dashed var(--line);border-radius:6px;color:var(--muted);text-align:center;margin-bottom:34px}
.rt-week{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--sheet)}
.rt-row{display:grid;grid-template-columns:104px 1fr;border-bottom:1px solid var(--line)}.rt-row:last-child{border:0}
.rt-day{padding:16px;font-weight:800;font-size:1.05rem;background:var(--paper);border-right:1px solid var(--line)}.rt-day small{display:block;font-weight:500;color:var(--muted);font-size:.72rem}
.rt-slots{display:flex;flex-wrap:wrap;gap:10px;padding:12px;align-items:center}
.rt-slot{padding:9px 13px;border-radius:4px;background:color-mix(in srgb,var(--accent) 14%,transparent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);min-width:120px}
.rt-slot b{display:block;color:var(--accent);font-size:.92rem}.rt-slot span{font-weight:650}.rt-slot small{display:block;color:var(--muted);font-size:.74rem;margin-top:2px}
.rt-free{color:var(--muted);font-size:.9rem;padding:4px 6px}
.rt-row.today{background:color-mix(in srgb,var(--accent) 10%,transparent)}.rt-row.today .rt-day{color:var(--accent)}

@media(max-width:560px){.rt-row{grid-template-columns:72px 1fr}.rt-day{padding:12px;font-size:.95rem}.rt-slot{min-width:100px;flex:1 1 40%}}
.rt-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.rt-remind{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:999px;font-weight:800;color:#fff!important;text-decoration:none;background:linear-gradient(100deg,#c2255c,#e8590c,#f2b705);background-size:200% 100%;animation:rtShift 6s ease infinite;box-shadow:0 6px 0 #16233a22;transition:transform .2s}
.rt-remind:hover{transform:translateY(-3px) scale(1.03)}.rt-remind span{transition:transform .2s}.rt-remind:hover span{transform:translateX(4px)}
@keyframes rtShift{50%{background-position:100% 0}}
</style>
</head>
<body data-page="routine">
<div id="app"></div>

<div id="rt" class="rt">
  <section class="page-head rt-top"><div><div class="eyebrow">Plan your week</div><h1>My routine</h1></div><a class="rt-remind" href="reminders.html">🔔 Reminders <span>→</span></a></section>
  <section id="rt-today"></section>
  <section><div class="rt-hd"><h2>Weekly timetable</h2></div><div id="rt-week" class="rt-week"><p class="muted" style="padding:20px">Loading routine…</p></div></section>
</div>

<script src="app.js"></script>
<script>
(() => {
  const USER = 'farhan0-0labib', REPO = 'Farhan-Labib', CK = 'routine.cache.v2';
  const DAYS = ['Saturday','Sunday','Monday','Tuesday','Wednesday','Thursday','Friday'];
  const NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const pad = n => String(n).padStart(2, '0');
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1).toLowerCase() : 'Other';
  const hhmm = raw => {
    const s = String(raw || '').replace(/["']/g, '').trim();
    if (/^\d{5,}$/.test(s)) { const t = +s; return pad(Math.floor(t / 3600)) + ':' + pad(Math.floor(t % 3600 / 60)); }
    const m = s.match(/(\d{1,2}):(\d{2})/);
    return m ? pad(+m[1]) + ':' + m[2] : (s || '—');
  };
  const mins = t => { const m = /^(\d{2}):(\d{2})$/.exec(t); return m ? +m[1] * 60 + +m[2] : 9999; };

  function parseFile(text) {
    const p = text.replace(/\r/g, '').split('---'), fm = p[1] || '';
    const g = k => { const m = fm.match(new RegExp('^' + k + ':[ \\t]*(.*)$', 'm')); return m ? m[1].trim().replace(/^["']|["']$/g, '').trim() : ''; };
    return { day: cap(g('day')), subject: g('subject') || 'No subject', time: hhmm(g('event_time')), body: p.slice(2).join('---').replace(/[#*_`>]/g, '').replace(/\s+/g, ' ').trim() };
  }
  async function viaStatic() {                 // no API limits: files are served by the site itself
    const jobs = [];
    DAYS.forEach(d => { for (let n = 0; n <= 6; n++) jobs.push(fetch(`_routine/${d.toLowerCase()}${n ? '-' + n : ''}.md?t=${Date.now() >> 16}`).then(r => r.ok ? r.text() : null).catch(() => null)); });
    const out = (await Promise.all(jobs)).filter(Boolean).map(parseFile);
    if (!out.length) throw new Error('No routine files found');
    return out;
  }
  async function fetchRoutine() {
    try { return await viaApi(); } catch (e) { console.warn('GitHub API failed, using site files:', e.message); return viaStatic(); }
  }
  async function viaApi() {
    const r = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/_routine`);
    if (!r.ok) throw new Error('GitHub API error ' + r.status + (r.status === 403 ? ' (rate limit: too many loads from this network, try again in a few minutes)' : ''));
    const files = (await r.json()).filter(f => f.name.endsWith('.md'));
    const res = await Promise.allSettled(files.map(f => fetch(f.download_url).then(x => { if (!x.ok) throw new Error(f.name + ' ' + x.status); return x.text(); }).then(parseFile)));
    const ok = res.filter(x => x.status === 'fulfilled').map(x => x.value);
    if (!ok.length && files.length) throw new Error('Could not download the routine files: ' + (res[0].reason && res[0].reason.message));
    return ok;                                  // one broken file no longer breaks the whole page
  }
  async function getItems() {
    let cache = null;
    try { cache = JSON.parse(localStorage.getItem(CK) || 'null'); } catch (e) {}
    if (cache && Date.now() - cache.t < 180000) return cache.items;      // fresh for 3 min (saves GitHub requests)
    try {
      const items = await fetchRoutine();
      try { localStorage.setItem(CK, JSON.stringify({ t: Date.now(), items })); } catch (e) {}
      return items;
    } catch (e) { if (cache) return cache.items; throw e; }              // offline / rate-limited: use the last saved copy
  }

  let ITEMS = [];
  function renderToday() {
    const now = new Date(), dn = NAMES[now.getDay()], nm = now.getHours() * 60 + now.getMinutes();
    const list = ITEMS.filter(i => i.day === dn).sort((a, b) => mins(a.time) - mins(b.time));
    const next = list.findIndex(i => mins(i.time) >= nm);
    const head = `<div class="rt-hd"><div><div class="eyebrow">Today</div><h2>${dn}, ${now.toLocaleDateString('en-GB', { day: 'numeric', month: 'long' })}</h2></div>
      <div class="rt-sum">${list.length ? `${list.length} item${list.length > 1 ? 's' : ''} · first at ${esc(list[0].time)}` : ''}</div></div>`;
    const body = list.length
      ? `<div class="rt-today">${list.map((i, k) => {
          const cls = k === next ? 'next' : mins(i.time) < nm ? 'past' : '';
          const label = k === next ? 'Up next' : cls === 'past' ? 'Earlier' : 'Later';
          return `<div class="rt-t ${cls}"><b>${esc(i.time)}</b><span>${esc(i.subject)}</span><em>${label}</em></div>`;
        }).join('')}</div>`
      : `<div class="rt-empty">🎉 Nothing scheduled today — enjoy the free time!</div>`;
    document.getElementById('rt-today').innerHTML = head + body;
  }
  function renderWeek() {
    const today = NAMES[new Date().getDay()], by = {};
    ITEMS.forEach(i => (by[i.day] = by[i.day] || []).push(i));
    const order = DAYS.concat(Object.keys(by).filter(d => !DAYS.includes(d)));
    document.getElementById('rt-week').innerHTML = order.map(d => {
      const l = (by[d] || []).sort((a, b) => mins(a.time) - mins(b.time));
      return `<div class="rt-row ${d === today ? 'today' : ''}"><div class="rt-day">${esc(d.slice(0, 3))}<small>${esc(d)}</small></div><div class="rt-slots">${
        l.map(i => `<div class="rt-slot"><b>${esc(i.time)}</b><span>${esc(i.subject)}</span>${i.body ? `<small>${esc(i.body)}</small>` : ''}</div>`).join('') || '<span class="rt-free">Free</span>'
      }</div></div>`;
    }).join('');
  }
  async function init() {
    try { ITEMS = await getItems(); renderToday(); renderWeek(); setInterval(renderToday, 60000); }
    catch (e) {
      console.error(e);
      document.getElementById('rt-week').innerHTML = '<div style="padding:20px;color:orange">Could not load the routine.<br><small>' + esc((e && e.message) || e) + '</small><br><button class="button secondary" style="margin-top:12px" onclick="localStorage.removeItem(\'routine.cache.v2\');location.reload()">↻ Try again</button></div>';
    }
  }
  // app.js builds the menu + footer asynchronously: wait for its <main>, then put the routine INSIDE it (so the footer stays below)
  let tries = 0;
  const wait = setInterval(() => {
    const m = document.querySelector('#app main'); tries++;
    if (m || tries > 100) { clearInterval(wait); if (m) m.appendChild(document.getElementById('rt')); init(); }
  }, 50);
})();
</script>
</body>
</html>
