<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Routine | Farhan Labib</title>
    <!-- আপনার মেইন সাইটের ডিজাইন লোড করা হচ্ছে -->
    <link rel="stylesheet" href="styles.css"> 
    <style>
        /* রুটিন কার্ডের জন্য বাড়তি কিছু ডিজাইন */
        .routine-container { max-width: 800px; margin: 100px auto 40px; padding: 20px; }
        .routine-card { background: #1e1e2f; color: white; padding: 20px; margin-bottom: 20px; border-left: 5px solid #007bff; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .routine-card h3 { margin: 0 0 10px 0; color: #007bff; font-size: 1.5rem; }
        .routine-card p { margin: 8px 0; color: #ccc; }
        .time-badge { background: #28a745; color: white; padding: 4px 10px; border-radius: 12px; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body data-page="routine">
    <div id="app"></div> <!-- মেনু ও ফুটার এখানে লোড হবে -->

    <div class="routine-container">
        <h1 style="text-align: center; margin-bottom: 30px;">My Weekly Routine</h1>
        <div id="routine-list">Loading...</div>
    </div>

    <!-- আপনার মেইন app.js লোড করা হচ্ছে (মেনুর জন্য) -->
    <script src="app.js"></script>

    <script>
        const user = "farhan0-0labib";
        const repo = "Farhan-Labib";

        async function loadRoutine() {
            const listDiv = document.getElementById('routine-list');
            try {
                const response = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/_routine`);
                const files = await response.json();

                if (!files || files.length === 0) {
                    listDiv.innerHTML = "<p style='text-align:center;'>No routine found.</p>";
                    return;
                }

                listDiv.innerHTML = ""; 

                for (let file of files) {
                    if(file.name.endsWith('.md')){
                        const fileRes = await fetch(file.download_url);
                        const text = await fileRes.text();
                        
                        const parts = text.split('---');
                        const frontmatter = parts[1] || "";
                        const body = parts[2] ? parts[2].trim() : "No details";

                        const dayMatch = frontmatter.match(/day:\s*(.*)/);
                        const subjectMatch = frontmatter.match(/subject:\s*(.*)/);
                        const eventTimeMatch = frontmatter.match(/event_time:\s*(.*)/);

                        const day = dayMatch ? dayMatch[1].trim() : "Unknown";
                        const subject = subjectMatch ? subjectMatch[1].trim() : "No Subject";
                        let eventTime = eventTimeMatch ? eventTimeMatch[1].replace(/["']/g, '').trim() : "N/A";

                        // সেকেন্ডকে ঘণ্টা-মিনিটে রূপান্তর
                        if (!isNaN(eventTime) && eventTime.length > 4) {
                            let totalSeconds = parseInt(eventTime);
                            let h = Math.floor(totalSeconds / 3600).toString().padStart(2, '0');
                            let m = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
                            eventTime = `${h}:${m}`;
                        } else if(eventTime.includes(':')) {
                            // যদি datetime ফরম্যাটে থাকে
                            const timeParts = eventTime.split('T');
                            if(timeParts.length > 1) {
                                eventTime = timeParts[1].slice(0, 5);
                            }
                        }

                        const card = document.createElement('div');
                        card.className = 'routine-card';
                        card.innerHTML = `
                            <h3>${day}</h3>
                            <p><strong>Subject:</strong> ${subject}</p>
                            <p><span class="time-badge">Time: ${eventTime}</span></p>
                            <p><em>${body}</em></p>
                        `;
                        listDiv.appendChild(card);
                    }
                }
            } catch (error) {
                listDiv.innerHTML = "<p style='color:red; text-align:center;'>Failed to load routine.</p>";
            }
        }

        // ডিজাইন লোড হওয়ার জন্য ১ সেকেন্ড অপেক্ষা
        setTimeout(loadRoutine, 1000);
    </script>
</body>
</html>
